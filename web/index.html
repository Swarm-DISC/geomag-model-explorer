<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geomag Model Explorer — geomagnetic field globe</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./vendor/uPlot.min.css">
<script type="importmap">
  {"imports": {"three": "./vendor/three.module.js",
               "uplot": "./vendor/uPlot.esm.js"}}
</script>
</head>
<body>
<header id="controls">
  <button id="controls-toggle" class="chrome-toggle" type="button"
    aria-expanded="true" aria-controls="controls"
    title="Hide controls">▴</button>
  <!-- layer 1: what to explore — category pills + model (features/studies.js
       fills the slots; empty slots collapse on flag-off deploys) -->
  <div class="controls-row" id="controls-primary">
    <span id="title">Geomag Model Explorer</span>
    <button id="view-reset" class="chrome-toggle" type="button"
      title="Reset to defaults">⌂</button>
    <span class="ctl-slot" id="slot-category"></span>
    <span class="ctl-slot" id="slot-model"></span>
  </div>
  <!-- layer 2: what is in the sum — field checkboxes (B|dB/dt swap in
       #slot-sv on Core) + the Visualisation series select + pinned date -->
  <div class="controls-row" id="controls-secondary">
    <span class="ctl-label" id="fields-label">Fields to include</span>
    <fieldset id="field-toggles" aria-label="fields"></fieldset>
    <span class="ctl-slot" id="slot-sv"></span>
    <span class="ctl-divider" aria-hidden="true"></span>
    <div id="date-control">
      <input type="date" id="date-picker">
      <span id="fetch-chip" hidden></span>
    </div>
  </div>
</header>

<!-- view pane: the globe and (v2.13) the series charts; overlay anchor
     for the ⓘ button, which must survive the globe hiding in series view -->
<div id="viewport">
<main id="globe">
  <!-- layer 3: how it is drawn — floating box, top-left of the globe
       (component here; sun/relief fill #slot-flags, frame fills #slot-frame) -->
  <div id="vis-options">
    <button id="vis-options-toggle" class="chrome-toggle" type="button"
      aria-expanded="true" aria-controls="vis-options"
      title="Hide visualisation options">✕</button>
    <div id="vis-options-body">
      <span class="ctl-label">Magnetic field component:</span>
      <fieldset id="component-radios" aria-label="component"></fieldset>
      <hr class="vis-divider">
      <span class="ctl-label">Display options:</span>
      <div id="slot-flags"></div>
      <div id="slot-frame"></div>
    </div>
  </div>
  <div id="shell-control">
    <label for="shell-slider">Shell altitude</label>
    <input type="range" id="shell-slider" min="0" max="0" step="1" value="0">
    <span id="shell-label"></span>
  </div>
  <div id="readout" hidden></div>
  <div id="colorbar">
    <span id="colorbar-max"></span>
    <div id="colorbar-ramp-wrap"><div id="colorbar-ramp"></div></div>
    <span id="colorbar-min"></span>
    <button id="colorbar-lock" aria-pressed="false"
      title="lock colour scale">🔓</button>
  </div>
  <div id="attribution">
    An <a href="https://earth.esa.int/eogateway/missions/swarm"
      target="_blank" rel="noopener">ESA Swarm</a> project via
    <a href="https://vires.services" target="_blank" rel="noopener">VirES</a>
    — <span id="model-attribution">Comprehensive Inversion models
    (<a href="https://swarmhandbook.earth.esa.int/catalogue/sw_mco_sha_2c" target="_blank" rel="noopener">MCO</a>/<a href="https://swarmhandbook.earth.esa.int/catalogue/sw_mli_sha_2c" target="_blank" rel="noopener">MLI</a>/<a href="https://swarmhandbook.earth.esa.int/catalogue/sw_mio_sha_2c" target="_blank" rel="noopener">MIO</a>/<a href="https://swarmhandbook.earth.esa.int/catalogue/sw_mma_sha_2c" target="_blank" rel="noopener">MMA</a>_SHA_2C; DTU Space et&nbsp;al.)</span>
  </div>
  <div id="error" hidden></div>
</main>
</div>

<footer id="timebar">
  <button id="play-btn" aria-label="play/pause">⏵</button>
  <input type="range" id="time-slider" min="0" max="1440" step="1" value="0">
  <span id="time-label">00:00</span>
  <select id="speed-select" aria-label="playback speed">
    <option value="1">1×</option>
    <option value="2">2×</option>
    <option value="4" selected>4×</option>
    <option value="8">8×</option>
  </select>
</footer>

<script type="module" src="./main.js"></script>
</body>
</html>
