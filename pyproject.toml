[project]
name = "geomag-model-explorer"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
fetch = [
    "viresclient>=0.16.0",
]
# dev-time only: nio colormap LUT + coastline texture generation (export.py --assets)
assets = [
    "chaosmagpy>=0.14",
    "matplotlib>=3.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    # starlette 1.x TestClient prefers "httpx2" but falls back to httpx with a
    # deprecation warning; stick with the long-established httpx package.
    "httpx>=0.27",
    "pytest>=9.0.3",
    "pytest-playwright>=0.8.0",
]
