# Heimdall manifest — the single source of truth for how Heimdall treats this repo.
# This file is PUBLISHED as-is, so keep it free of internal identifiers (no internal org/host
# names). The internal remote is derived by Heimdall as ${INTERNAL_ORG}/<slug>; do not add it here.

[project]
slug = "geomag-model-explorer"

[publish]
provider = "github"             # github | gitlab | codeberg | forgejo
remote   = "Swarm-DISC/geomag-model-explorer"
description = "Interactive 3D visualization of Earth's geomagnetic field from the Swarm L2 model chain, evaluated via VirES and rendered on a three.js globe."
topics = ["swarm", "geomagnetism", "geomagnetic-field", "vires", "threejs", "webgl", "visualization"]

[history]
mode = "snapshot"               # one-way clean tree export; internal history is NOT published
                                # (graduate to shared later if history is scrubbed + re-seeded)

[sync]
branches = ["main"]             # only these branches mirror/reconcile; all else stays private

[gate]
# require_license = true        # only set if you want the gate to insist a LICENSE exists
# license = "MIT"               # SPDX id the gate matches against; Heimdall imposes none
# secret_scan = "gitleaks"      # default
# checks = ["make test"]        # arbitrary commands, any language; run by the gate

# [preview]                     # LAN preview (optional). {port}/{prefix} are substituted by Heimdall.
# cmd = "make preview PORT={port} PREFIX={prefix}"
# websocket = true

[deploy]                        # emit-only deployment-setup registration
target = "deployment-setup/experimental"
name = "geomag-model-explorer"
ref = "main"
port = 8000
description = "Interactive 3D geomagnetic field globe (Swarm L2 model chain via VirES)."
